<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600&amp;display=swap');
    </style>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dcb028;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c59a16;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background Circle with subtle gradient based on #c59a16 -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)" />
  
  <!-- Text Element -->
  <text 
    x="50%" 
    y="50%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-family="'Lora', 'Times New Roman', serif" 
    font-weight="600" 
    font-size="240" 
    fill="#ffffff" 
    filter="url(#shadow)"
    dy="10">JK</text>
</svg>